<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — Cristian Giehl</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0a0a0a;
        color: #fafaf7;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
        max-width: 32rem;
        color: #a3a39b;
        line-height: 1.6;
      }
      .en {
        opacity: 0.7;
        font-size: 0.95rem;
      }
      a {
        margin-top: 0.5rem;
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #c4f000;
        color: #0a0a0a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Você está offline</h1>
    <p>
      Não foi possível carregar esta página sem conexão. Verifique sua internet
      e tente novamente.
    </p>
    <p class="en">
      <strong>You're offline.</strong> This page couldn't load without a
      connection. Check your network and try again.
    </p>
    <a href="/">Voltar ao início / Back home</a>
  </body>
</html>
